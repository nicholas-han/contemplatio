<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>微博语义过滤</title><link rel="stylesheet" href="ui.css"></head><body class="popup"><main>
<div class="row between"><h1>微博语义过滤</h1><label><input id="enabled" type="checkbox"> 启用</label></div>
